[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
verbosity = 2

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

# The settings Karwan deployed with on Arc mainnet. script/verify-mainnet.sh
# builds under this profile and compares against the live contract.
[profile.mainnet]
optimizer_runs = 1
via_ir = true
